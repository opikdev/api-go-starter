name: api-go-starter

services:
  db:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: api_owner
      POSTGRES_PASSWORD: api_owner_dev_password
      POSTGRES_DB: api
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, because the temporary server used during first-time setup only listens on a socket.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U api_owner -d api]
      interval: 2s
      timeout: 3s
      retries: 90

  migrate:
    # The one service that builds the image. seed and api reuse it.
    image: api-go-starter:dev
    build: .
    read_only: true
    command: [migrate]
    environment:
      MIGRATION_DATABASE_URL: postgres://api_owner:api_owner_dev_password@db:5432/api?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: api-go-starter:dev
    pull_policy: never
    read_only: true
    command: [seed]
    environment:
      MIGRATION_DATABASE_URL: postgres://api_owner:api_owner_dev_password@db:5432/api?sslmode=disable
      SEED_DEMO_DATA: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: api-go-starter:dev
    pull_policy: never
    read_only: true
    environment:
      DATABASE_URL: postgres://api_app:api_app_dev_password@db:5432/api?sslmode=disable
      DOCS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    # Above SHUTDOWN_DRAIN_SECONDS plus SHUTDOWN_TIMEOUT_SECONDS, so in-flight requests finish before a SIGKILL.
    stop_grace_period: 40s
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  db-data:
