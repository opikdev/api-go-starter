schema: 1
requires:
  - name: docker
  - name: go
    version: 1.27.4
    versionArgs: [version]
  - name: make
prompts:
  - name: name
    message: Project name, in kebab-case
    pattern: ^[a-z][a-z0-9-]{0,49}$
    default: "{{dir}}"
  - name: module
    message: Go module path, such as github.com/you/my-api
    pattern: ^[a-z0-9][a-z0-9._~-]*(/[A-Za-z0-9._~-]+)*$
    default: "{{dir}}"
  - name: owner
    message: GitHub owner, for README links and code owners
    pattern: ^[A-Za-z0-9-]{1,39}$
    optional: true
replace:
  - from: '"extends": ["config:recommended", "github>opikdev/starters//renovate/baseline"]'
    to: '"extends": ["config:recommended"]'
    files: [renovate.json]
  - from: "## Start your own project\n\nCreate a renamed copy with [pik](https://github.com/opikdev/pik). It downloads this starter's latest release, then sets your project name and GitHub owner:\n\n```sh\npik new api-go-starter my-api\n```\n\nOr select **Use this template** on GitHub. That copy keeps the name `api-go-starter` and the owner `opikdev`, so follow `pik.yaml` by hand: swap the `replace` text, delete the `exclude` paths, and run the `setup` commands.\n\n## Usage\n"
    to: "## Usage\n"
    files: [README.md]
  - from: github.com/opikdev/api-go-starter
    to: "{{module}}"
    files:
      - go.mod
      - cmd/api/main.go
      - internal/arch_test.go
      - internal/app/auth_test.go
      - internal/app/cleanup.go
      - internal/app/database_test.go
      - internal/app/handlers.go
      - internal/app/health.go
      - internal/app/http_test.go
      - internal/app/idempotency.go
      - internal/app/idempotency_test.go
      - internal/app/main_test.go
      - internal/app/middleware.go
      - internal/app/notes.go
      - internal/app/notes_test.go
      - internal/app/ratelimit.go
      - internal/app/ratelimit_test.go
      - internal/app/server.go
      - internal/app/sessions.go
      - internal/app/users.go
      - internal/app/validation.go
      - internal/database/database.go
      - test/e2e/stack_test.go
  - from: "# API Go starter\n"
    to: "# {{name}}\n"
    files: [README.md]
  - from: "opikdev/api-go-starter\ncd api-go-starter\n"
    to: "{{owner}}/{{name}}\ncd {{name}}\n"
    files: [README.md]
  - from: opikdev/api-go-starter
    to: "{{owner}}/{{name}}"
    files: [README.md]
  - from: "@opikdev"
    to: "@{{owner}}"
    files: [.github/CODEOWNERS]
  # Keep in step with info.version in api/openapi.yaml. scripts/check-pik-manifest.sh fails otherwise.
  - from: "  version: 0.4.0\n"
    to: "  version: 0.1.0\n"
    files: [api/openapi.yaml]
  - from: api-go-starter
    to: "{{name}}"
    files:
      - api/openapi.yaml
      - .env.example
      - compose.yaml
      - .devcontainer/devcontainer.json
      - internal/config/config.go
      - internal/config/config_test.go
      - docs/operations.md
  # The module path above may contain the project name, so rename only these exact strings here.
  - from: '"api-go-starter-e2e"'
    to: '"{{name}}-e2e"'
    files: [test/e2e/stack_test.go]
  - from: 'traces.contains("api-go-starter")'
    to: 'traces.contains("{{name}}")'
    files: [test/e2e/stack_test.go]
exclude:
  - .baseline.sha256
  - .github/workflows/baseline-check.yml
  - .github/workflows/template.yml
  - scripts/check-pik-manifest.sh
setup:
  - go mod download
  # Embeds the renamed spec in the generated server.
  - go generate ./...
  - "printf '# Changelog\\n\\nAll notable changes to this project are recorded here. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\\n\\n## [Unreleased]\\n' > CHANGELOG.md"
next:
  - docker compose up --build --wait api
check:
  - make verify
  - make e2e
